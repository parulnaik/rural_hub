{% extends "base.html" %}

{% block title %}401 - Unauthorized{% endblock %}

{% block content %}
<div class="text-center" style="padding: 4rem 1rem;">
    <h1 style="font-size: 5rem; color: var(--warning); margin-bottom: 0;">401</h1>
    <h2>Unauthorized Access</h2>
    <p class="mb-2 text-secondary">You do not have permission to view this page. Please log in with appropriate credentials.</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Login</a>
</div>
{% endblock %}
