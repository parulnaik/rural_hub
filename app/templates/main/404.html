{% extends "base.html" %}

{% block title %}404 - Not Found{% endblock %}

{% block content %}
<div class="text-center" style="padding: 4rem 1rem;">
    <h1 style="font-size: 5rem; color: var(--primary-color); margin-bottom: 0;">404</h1>
    <h2>Page Not Found</h2>
    <p class="mb-2 text-secondary">The page you are looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
