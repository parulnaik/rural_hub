[project]
name = "rural-hub"
version = "1.0.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "Flask==3.0.0",
    "Werkzeug==3.0.1",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.0.5",
    "Flask-Login==0.6.3",
    "SQLAlchemy==2.0.23",
    "python-dotenv==1.0.0",
    "cloudinary==1.36.0",
    "WTForms==3.1.1",
    "Flask-WTF==1.2.1",
    "psycopg2-binary==2.9.9",
    "gunicorn"
]

[tool.vercel]
entrypoint = "run:app"